name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
      - run: bun run ci
      - run: bun run verify:npm
      - run: bun pm pack --dry-run
        working-directory: packages/cli

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            build: build:linux
            package: package:linux
            artifact: mu-linux-x64
            archive: mu-linux-x64.tar.gz
          - runner: macos-14
            build: build:macos
            package: package:macos
            artifact: mu-darwin-arm64
            archive: mu-darwin-arm64.tar.gz
          - runner: windows-latest
            build: build:windows
            package: package:windows
            artifact: mu-windows-x64.exe
            archive: mu-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
        with:
          bun-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version-file: package.json
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.build }}
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/${{ matrix.artifact }}
      - run: ./dist/${{ matrix.artifact }} --version
      - run: ./dist/${{ matrix.artifact }} --help
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose dist/${{ matrix.artifact }}
      - name: Package pinned ripgrep sidecar
        run: bun run ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp packages/cli/THIRD_PARTY_LICENSES.txt dist/THIRD_PARTY_LICENSES.txt
      - name: Create checksums
        working-directory: dist
        run: >-
          sha256sum mu-linux-x64 mu-darwin-arm64 mu-windows-x64.exe
          mu-linux-x64.tar.gz mu-darwin-arm64.tar.gz mu-windows-x64.zip
          THIRD_PARTY_LICENSES.txt
          > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/mu-linux-x64 dist/mu-darwin-arm64 dist/mu-windows-x64.exe
          dist/mu-linux-x64.tar.gz dist/mu-darwin-arm64.tar.gz
          dist/mu-windows-x64.zip dist/THIRD_PARTY_LICENSES.txt dist/SHA256SUMS
          --generate-notes --verify-tag
