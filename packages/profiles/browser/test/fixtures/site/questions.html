<!doctype html>
<html><head><title>Questions</title></head><body>
<h1>Application questions</h1>
<form onsubmit="event.preventDefault(); document.getElementById('sent').textContent = 'Sent: ' + new URLSearchParams(new FormData(this)).toString();">
  <fieldset><legend>Have you worked here before?</legend>
    <label><input type="radio" name="before" value="yes"> Yes</label>
    <label><input type="radio" name="before" value="no"> No</label>
  </fieldset>
  <div role="radiogroup" aria-label="Do you need visa sponsorship?">
    <label><input type="radio" name="visa" value="yes"> Yes</label>
    <label><input type="radio" name="visa" value="no"> No</label>
  </div>
  <label>Country <select name="country"><option value="">Choose…</option><option>India</option><option>France</option></select></label>
  <label>Notes <input name="notes" disabled></label>
  <button type="submit">Save answers</button>
</form>
<p id="sent"></p>
</body></html>
