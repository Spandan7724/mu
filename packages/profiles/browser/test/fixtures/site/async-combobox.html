<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Education</title>
<style>body{font-family:sans-serif;margin:20px} .menu{border:1px solid #999;width:320px} [role=option]{padding:4px;cursor:pointer}</style></head>
<body>
<h1>Education</h1>
<!-- Like Greenhouse's School field (react-select async): keystrokes open the list, which
     says "Loading..." through a debounce longer than typing settles for and a slow search,
     then shows the matches. Typed text that was not picked is dropped on blur. -->
<label id="school-label" for="school">School</label>
<input id="school" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="school-label" autocomplete="off">
<p>School: <span id="school-value">none</span></p>
<script>
const input = document.getElementById('school');
let menu, timer, generation = 0;
function close() {
  menu?.remove(); menu = undefined;
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-controls');
}
function show(html) {
  if (!menu) {
    menu = document.createElement('div');
    menu.className = 'menu';
    input.after(menu);
  }
  menu.innerHTML = html;
  input.setAttribute('aria-expanded', 'true');
}
function search() {
  const current = ++generation;
  input.removeAttribute('aria-controls');
  show('<div class="notice">Loading...</div>');
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const response = await fetch('/api/schools?delay=1800&q=' + encodeURIComponent(input.value));
    const schools = await response.json();
    if (current !== generation || !menu) return;
    if (!schools.length) { show('<div class="notice">No options</div>'); return; }
    show('<div role="listbox" id="school-listbox"></div>');
    for (const school of schools) {
      const option = document.createElement('div');
      option.role = 'option';
      option.textContent = school;
      option.addEventListener('mousedown', (e) => {
        e.preventDefault();
        document.getElementById('school-value').textContent = school;
        input.value = '';
        close();
      });
      menu.firstChild.appendChild(option);
    }
    input.setAttribute('aria-controls', 'school-listbox');
  }, 700);
}
input.addEventListener('keydown', () => setTimeout(search));
input.addEventListener('blur', () => { input.value = ''; close(); });
</script>
</body></html>
