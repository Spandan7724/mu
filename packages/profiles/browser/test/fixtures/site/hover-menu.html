<!doctype html>
<html><head><title>Hover menu</title>
<style>
  #panel { display: none; position: fixed; top: 40px; left: 0; right: 0; height: 400px; background: #eee; }
  #panel.open { display: block; }
  main { margin-top: 120px; }
</style></head><body>
<button id="menu">Browse jobs</button>
<div id="panel"><a href="#all">All jobs</a></div>
<main><button id="go" onclick="document.getElementById('out').textContent='Pressed'">Save date</button><p id="out"></p></main>
<script>
  const menu = document.getElementById("menu"), panel = document.getElementById("panel");
  menu.addEventListener("mouseenter", () => panel.classList.add("open"));
  menu.addEventListener("mouseleave", () => setTimeout(() => panel.classList.remove("open"), 50));
</script>
</body></html>
