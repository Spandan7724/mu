<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create your Example Corp account</title></head>
<body>
<h1>Create your account</h1>
<form id="start">
  <label>Email <input name="email" type="email"></label>
  <button type="submit">Send verification code</button>
</form>
<form id="verify" hidden>
  <p>We emailed a 6-digit code to <span id="sent-to"></span>.</p>
  <label>Verification code <input name="code" autocomplete="one-time-code" inputmode="numeric"></label>
  <button type="submit">Verify</button>
  <p id="error" role="alert"></p>
</form>
<p id="done" hidden>Account verified. Welcome to Example Corp!</p>
<script>
  const start = document.getElementById("start"), verify = document.getElementById("verify");
  start.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = start.email.value.trim();
    await fetch("/signup/send", { method: "POST", body: JSON.stringify({ email }) });
    document.getElementById("sent-to").textContent = email;
    start.hidden = true;
    verify.hidden = false;
  });
  verify.addEventListener("submit", async (event) => {
    event.preventDefault();
    const response = await fetch("/signup/verify", { method: "POST", body: JSON.stringify({ code: verify.code.value }) });
    const { ok } = await response.json();
    if (!ok) { document.getElementById("error").textContent = "That code is not right."; return; }
    verify.hidden = true;
    document.getElementById("done").hidden = false;
  });
</script>
</body></html>
