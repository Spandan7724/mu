<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Long list</title><style>body{font-family:sans-serif;margin:20px} li{height:40px}</style></head>
<body>
<h1>Articles</h1>
<ul id="list"></ul>
<script>
const list = document.getElementById('list');
for (let i = 1; i <= 80; i++) {
  const li = document.createElement('li');
  li.innerHTML = '<a href="/article/' + i + '">Article ' + i + '</a> <span>by author ' + i + '</span>';
  list.appendChild(li);
}
</script>
</body></html>
