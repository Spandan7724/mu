<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Questions</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .required::after { content: "*"; color: red; }
    .yesno button[aria-pressed=true] { background: #335; color: white; }
  </style>
</head>
<body>
  <main>
    <!-- Ashby's markup: question labels whose for= matches no control, required marked
         only by a CSS ::after "*", Yes/No answered with aria-pressed buttons. Both
         questions start below the fold and scroll into view together. -->
    <div style="height: 1400px"></div>
    <div>
      <label class="required" for="q-anchor">We work from our offices on Mondays, Tuesdays, and Thursdays (Anchor Days). If you need an accommodation, we will partner with you and explore reasonable options consistent with applicable law. Are you able to work from the office on Anchor Days?</label>
      <div class="yesno" id="anchor">
        <button type="button" aria-pressed="false">Yes</button>
        <button type="button" aria-pressed="false">No</button>
      </div>
    </div>
    <div>
      <label class="required" for="q-authorized">Are you authorized to work lawfully in the United States?</label>
      <div class="yesno" id="authorized">
        <button type="button" aria-pressed="false">Yes</button>
        <button type="button" aria-pressed="false">No</button>
      </div>
    </div>
    <div>
      <label class="required" for="q-terms">We collect the information you provide in this application, including your contact details, work history, education, answers to screening questions and any documents you upload, in order to evaluate your candidacy for this role and for similar roles that may open in the future. We may share it with service providers who help us run our hiring process, such as background check vendors and interview scheduling tools, under agreements that require them to protect it. We keep application records for up to three years after the hiring decision unless the law requires otherwise, and you can ask us to access, correct or delete your information at any time by writing to our privacy team. Do you agree to these terms?</label>
      <div class="yesno" id="terms">
        <button type="button" aria-pressed="false">Yes</button>
        <button type="button" aria-pressed="false">No</button>
      </div>
    </div>
    <fieldset>
      <label class="required" for="q-pronouns">What pronouns would you like us to use?</label>
      <div><input type="radio" id="p0" name="pronouns"><label for="p0">He/Him</label></div>
      <div><input type="radio" id="p1" name="pronouns"><label for="p1">Prefer not to say</label></div>
    </fieldset>
    <div>
      <label for="q-note">Anything else?</label>
      <div><input type="text" name="note"></div>
    </div>
  </main>
  <script>
    for (const group of document.querySelectorAll('.yesno')) {
      for (const button of group.querySelectorAll('button')) {
        button.addEventListener('click', () => {
          for (const other of group.querySelectorAll('button'))
            other.setAttribute('aria-pressed', String(other === button));
        });
      }
    }
  </script>
</body>
</html>
