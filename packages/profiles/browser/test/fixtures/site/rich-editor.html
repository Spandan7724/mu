<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Compose</title>
<style>body{font-family:sans-serif;margin:20px} #body{border:1px solid #999;min-height:120px;padding:6px}</style></head>
<body>
<h1>New message</h1>
<label>Subject <input id="subject"></label>
<div id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message Body"></div>
<p>Lines: <span id="lines">0</span></p>
<script>
const body = document.getElementById('body');
body.addEventListener('input', () => {
  document.getElementById('lines').textContent = body.innerText.split('\n').filter(Boolean).length;
});
</script>
</body></html>
