<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialogs</title><style>body{font-family:sans-serif;margin:20px}</style></head>
<body>
<h1>Dialogs</h1>
<button onclick="alert('Saved!')">Show alert</button>
<button onclick="document.getElementById('out').textContent = confirm('Discard draft?') ? 'discarded' : 'kept'">Discard draft</button>
<button onclick="document.getElementById('out').textContent = 'Hello ' + prompt('Your name?', 'guest')">Ask name</button>
<p id="out"></p>
</body></html>
