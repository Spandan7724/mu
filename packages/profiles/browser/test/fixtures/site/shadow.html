<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shadow DOM</title><style>body{font-family:sans-serif;margin:20px}</style></head>
<body>
<h1>Web components</h1>
<search-box></search-box>
<user-card name="Alex Kim"></user-card>
<script>
customElements.define('search-box', class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = '<label>Search docs <input type="search" id="q"></label><button id="go">Go</button><p id="out"></p>';
    root.getElementById('go').addEventListener('click', () => {
      root.getElementById('out').textContent = 'Results for ' + root.getElementById('q').value;
    });
  }
});
customElements.define('user-card', class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = '<div><strong></strong><inner-actions></inner-actions></div>';
    root.querySelector('strong').textContent = this.getAttribute('name');
  }
});
customElements.define('inner-actions', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = '<button>Follow</button><a href="/profile">Profile</a>';
  }
});
</script>
</body></html>
